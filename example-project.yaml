# プロジェクト設定サンプル
# 使い方: bp collect --project example-project.yaml

project_id: "pallets-flask"

repo:
  url: https://github.com/pallets/flask
  vcs_type: git

tracker:
  type: github
  url: https://github.com/pallets/flask
  auth:
    token: ${GITHUB_TOKEN}

search:
  labels: [bug]
  state: closed
  limit: 100
  since: "2021-01-01"
  # true: マージ済みPRが紐付いていないIssueはスキップ
  require_pr: true

language:
  type: python
  # テストファイルと判定するパターン（リバースパッチ時のソース/テスト分割に使用）
  test_patterns:
    - "tests/**"
    - "test_*.py"
    - "*_test.py"
  # テスト実行前の環境セットアップ（worktree 内で一度だけ実行）
  setup_commands:
    - "pip install -e '.[dev]' --quiet"
  # テスト実行コマンド
  test_command: "pytest --tb=short -q"
  # タイムアウト（秒）
  test_timeout: 120

validation:
  # true にするとリバースパッチ戦略でテスト検証を行い
  # FAIL→PASS が確認されたものだけ "valid" として記録する
  enabled: false
  # reverse_patch_source: ソースファイルのみ逆パッチ（fixで追加されたテストは保持）
  # reverse_patch_all:    全ファイルを逆パッチ
  strategy: reverse_patch_source
