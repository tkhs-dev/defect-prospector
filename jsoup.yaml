# プロジェクト設定サンプル
# 使い方: bp collect --project jsoup.yaml
#
# jsoup は単一モジュールのMavenプロジェクトのため、ルートでの mvn test がそのまま使える。

project_id: "jhy-jsoup"

repo:
  url: https://github.com/jhy/jsoup
  vcs_type: git

tracker:
  type: github
  url: https://github.com/jhy/jsoup
  auth:
    token: ${GITHUB_TOKEN}

search:
  labels: [bug]
  state: closed
  limit: 500
  since: "2011-01-01"
  # true: マージ済みPRが紐付いていないIssueはスキップ
  require_pr: true

language:
  type: java
  # テストファイルと判定するパターン（リバースパッチ時のソース/テスト分割に使用）
  test_patterns:
    - "src/test/**"
    - "*Test.java"
    - "Test*.java"
    - "*Tests.java"
  # テスト実行前の環境セットアップ（worktree 内で一度だけ実行）
  setup_commands:
    - "mvn -q -B compile test-compile"
  # テスト実行コマンド
  test_command: "mvn test -B"
  # タイムアウト（秒）
  test_timeout: 300

validation:
  # true にするとリバースパッチ戦略でテスト検証を行い
  # FAIL→PASS が確認されたものだけ "valid" として記録する
  enabled: true
  # reverse_patch_source: ソースファイルのみ逆パッチ（fixで追加されたテストは保持）
  # reverse_patch_all:    全ファイルを逆パッチ
  strategy: reverse_patch_source
  # true にすると dataset/test-logs/{project_id}/ にテスト出力を保存する
  save_test_output: true
  # true にすると失敗したテストケース名をログに出力する
  show_failed_tests: true
