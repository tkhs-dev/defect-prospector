# プロジェクト設定サンプル
# 使い方: bp collect --project example-project.yaml

project_id: "clap-rs-clap"

repo:
  url: https://github.com/clap-rs/clap
  vcs_type: git

tracker:
  type: github
  url: https://github.com/clap-rs/clap
  auth:
    token: ${GITHUB_TOKEN}

search:
  labels: [C-bug]
  state: closed
  limit: 500
  since: "2011-01-01"
  # true: マージ済みPRが紐付いていないIssueはスキップ
  require_pr: true

language:
  type: rust
  # テストファイルと判定するパターン（リバースパッチ時のソース/テスト分割に使用）
  test_patterns:
    - "tests/**"
  # テスト実行前の環境セットアップ（worktree 内で一度だけ実行）
  setup_commands:
    - "cargo build --quiet"
  # テスト実行コマンド
  test_command: "cargo test"
  # タイムアウト（秒）
  test_timeout: 120

validation:
  # true にするとリバースパッチ戦略でテスト検証を行い
  # FAIL→PASS が確認されたものだけ "valid" として記録する
  enabled: true
  # reverse_patch_source: ソースファイルのみ逆パッチ（fixで追加されたテストは保持）
  # reverse_patch_all:    全ファイルを逆パッチ
  strategy: reverse_patch_source
  # true にすると dataset/test-logs/{project_id}/ にテスト出力を保存する
  save_test_output: true
  # true にすると失敗したテストケース名をログに出力する
  show_failed_tests: true

llm:
  # bp generate-tests 用（doc/test-generation.md 参照）
  enabled: true
  provider: claude_code
  max_attempts: 3
  max_context_chars: 20000
  # true: fixにテストが同梱されていても、FAIL→PASSを確認できていなければ生成対象にする
  #       （＝有効なテストが付属していない場合のみ生成）
  include_fixes_with_tests: true
  # true: 生成前にLLMへ「テストで再現可能か」を尋ね、不可能と答えたものは生成対象から外す
  #       （プログラム起因でないバグ・環境依存のバグ等。判定結果は dataset.db に保存される）
  screening: true
  claude_code:
    command: "claude"
    allowed_tools: "Read,Grep,Glob,Write,Edit"
    timeout: 900

# 修正の機械的な確認（doc/fix-checks.md）。各値は off / record（結果を記録）/ exclude（落ちたら fix_rejected として除外）
# ここが全収集元の既定値で、sources.<収集元>.fix_checks でキー単位に上書きできる
fix_checks:
  revert: record
  follow_up_fix: record
  follow_up_window_days: 30
  release: record
  ci: record

# 収集元（doc/pr-collection.md）。bp collect --source <name> で一時的に上書きできる
sources:
  issues:
    enabled: true
  # Issueに紐付かないマージ済みPR
  pull_requests:
    enabled: false
    title_keywords: null      # 例: [fix, bug, panic]。null なら絞らない（LLMバグ判定に任せる）
    max_source_lines: 2000
    fix_checks:
      revert: exclude
  # PRを経由しないデフォルトブランチへの直接コミット（独立したバグ報告もレビューも無いため確認を厳しめに）
  commits:
    enabled: false
    title_keywords: null
    max_source_lines: 2000
    exclude_pr_commits: true
    fix_checks:
      revert: exclude
      follow_up_fix: exclude
