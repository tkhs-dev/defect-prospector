# プロジェクト設定サンプル
# 使い方: bp collect --project log4j2.yaml
#
# log4j2 はマルチモジュールMavenプロジェクト（log4j-api, log4j-core, 各種
# アダプタ/アペンダーモジュール等）。中心的な実装・バグ修正が集中する log4j-core
# （とその依存である log4j-api）のみに -pl で絞り込む。

project_id: "apache-logging-log4j2"

repo:
  url: https://github.com/apache/logging-log4j2
  vcs_type: git

tracker:
  type: github
  url: https://github.com/apache/logging-log4j2
  auth:
    token: ${GITHUB_TOKEN}

search:
  labels: [bug]
  state: closed
  limit: 500
  since: "2011-01-01"
  # true: マージ済みPRが紐付いていないIssueはスキップ
  require_pr: true

language:
  type: java
  # テストファイルと判定するパターン（リバースパッチ時のソース/テスト分割に使用）
  test_patterns:
    - "log4j-core/src/test/**"
    - "log4j-api/src/test/**"
    - "*Test.java"
    - "Test*.java"
    - "*Tests.java"
  # テスト実行前の環境セットアップ（worktree 内で一度だけ実行）
  # -pl log4j-core -am: log4j-core とその依存モジュール(log4j-api等)のみビルド
  setup_commands:
    - "mvn -q -B -pl log4j-core -am compile test-compile"
  # テスト実行コマンド（log4j-core モジュールのみ）
  test_command: "mvn test -pl log4j-core -am -B"
  # タイムアウト（秒）
  test_timeout: 300

validation:
  # true にするとリバースパッチ戦略でテスト検証を行い
  # FAIL→PASS が確認されたものだけ "valid" として記録する
  enabled: true
  # reverse_patch_source: ソースファイルのみ逆パッチ（fixで追加されたテストは保持）
  # reverse_patch_all:    全ファイルを逆パッチ
  strategy: reverse_patch_source
  # true にすると dataset/test-logs/{project_id}/ にテスト出力を保存する
  save_test_output: true
  # true にすると失敗したテストケース名をログに出力する
  show_failed_tests: true

coverage:
  # true にすると、バグ状態（逆パッチ適用後）のワークツリーで
  # JaCoCo を ad hoc 実行し、diff coverage とプロジェクト全体の
  # カバレッジ率を記録する。マルチモジュール構成のため command/report_path は
  # log4j-core サブモジュールに明示的に絞り込む。
  # いったん無効化中（収集の速度・安定性を優先。必要になったら true に戻す）
  enabled: false
  tool: jacoco
  command: "mvn org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent test org.jacoco:jacoco-maven-plugin:0.8.12:report -pl log4j-core -am -B"
  report_path: "log4j-core/target/site/jacoco/jacoco.xml"
  timeout: 600
