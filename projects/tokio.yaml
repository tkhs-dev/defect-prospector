# Rust / 非同期ランタイム — 追加のRust側サンプル（clap/serde_json/hyperに次ぐ4件目）
# 使い方: bp collect --project projects/tokio.yaml

project_id: "tokio-rs-tokio"

repo:
  url: https://github.com/tokio-rs/tokio
  vcs_type: git

tracker:
  type: github
  url: https://github.com/tokio-rs/tokio
  auth:
    token: ${GITHUB_TOKEN}

search:
  labels: [C-bug]
  state: closed
  limit: 500
  since: "2016-01-01"
  require_pr: true

language:
  type: rust
  test_patterns:
    - "tests/**"
    - "**/tests/*.rs"
  setup_commands:
    - "cargo build --quiet --all-features"
  test_command: "cargo test --all-features"
  test_timeout: 300

validation:
  enabled: true
  strategy: reverse_patch_source
  save_test_output: false
  show_failed_tests: true

coverage:
  # 事前に `cargo install cargo-llvm-cov` が必要。
  # いったん無効化中（収集の速度・安定性を優先。必要になったら true に戻す）
  enabled: false
  tool: cargo-llvm-cov
  command: "cargo llvm-cov --workspace --all-features --cobertura --output-path target/llvm-cov-cobertura.xml"
  timeout: 1200
