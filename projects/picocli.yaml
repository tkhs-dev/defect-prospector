# Java / コマンドライン引数パーサー — Rust側の対応: clap.yaml (リポジトリルートの既存ファイル)
# 使い方: bp collect --project projects/picocli.yaml
#
# picocli はビルドを Gradle で行う（pom.xml も存在するが、公開用のスタブでビルドには使われない）。
# 以下の test_command / setup_commands / coverage.command は Windows 向け (gradlew.bat)。
# Linux/macOS で実行する場合は "gradlew.bat" を "./gradlew" に置き換えること。

project_id: "remkop-picocli"

repo:
  url: https://github.com/remkop/picocli
  vcs_type: git

tracker:
  type: github
  url: https://github.com/remkop/picocli
  auth:
    token: ${GITHUB_TOKEN}

search:
  # ラベル名にスペース・絵文字を含む ("type: bug :bug:")。GitHub Issue検索は
  # ラベル名をそのまま渡せば正しく解釈される（bug_prospector側で自動クォートする）。
  labels: ["type: bug :bug:"]
  state: closed
  limit: 500
  since: "2018-01-01"
  require_pr: true

language:
  type: java
  test_patterns:
    - "src/test/**"
  setup_commands:
    - "gradlew.bat compileTestJava -q"
  test_command: "gradlew.bat test --console=plain -q"
  test_timeout: 600

validation:
  enabled: true
  strategy: reverse_patch_source
  save_test_output: false
  show_failed_tests: true

coverage:
  # picocli の build.gradle には既に jacoco 設定がある
  enabled: true
  tool: jacoco
  command: "gradlew.bat test jacocoTestReport --console=plain -q"
  report_path: "build/reports/jacoco/test/jacocoTestReport.xml"
  timeout: 900
