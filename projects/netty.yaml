# Java / 非同期ネットワーキング — 追加のJava側サンプル（picocli/gson/vertxに次ぐ4件目）
# 使い方: bp collect --project projects/netty.yaml
#
# netty はマルチモジュールMavenプロジェクト（common/buffer/transport/codec/handler等、
# 多数のサブモジュールがルートpom.xml配下に存在する）。ルートから `mvn test` すると
# 全モジュールをビルド・テストするため非常に時間がかかる。バグごとに変更モジュールが
# 異なるため、本設定では絞り込みを行わずルート一括を既定値としている
# （実際にビルドする場合は変更ファイルに応じて -pl <module> -am を検討すること）。
#
# GitHub上のバグラベルは "bug" ではなく "defect" が使われている点に注意
# （事前に `gh api` でラベル別件数を確認済み: defect=81件、bug=0件）。

project_id: "netty-netty"

repo:
  url: https://github.com/netty/netty
  vcs_type: git

tracker:
  type: github
  url: https://github.com/netty/netty
  auth:
    token: ${GITHUB_TOKEN}

search:
  labels: [defect]
  state: closed
  limit: 500
  since: "2011-01-01"
  require_pr: true

language:
  type: java
  test_patterns:
    - "*/src/test/**"
    - "src/test/**"
    - "*Test.java"
    - "Test*.java"
    - "*Tests.java"
  setup_commands:
    - "mvn -q -B -DskipTests compile"
  test_command: "mvn test -B"
  test_timeout: 900

validation:
  enabled: true
  strategy: reverse_patch_source
  save_test_output: false
  show_failed_tests: true

coverage:
  # いったん無効化中（収集の速度・安定性を優先。必要になったら true に戻す）
  enabled: false
  tool: jacoco
  timeout: 1200
