[project]
name = "defect-prospector"
version = "0.1.0"
description = "Bug dataset collection tool"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pygithub>=2.1",
    "gitpython>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
bp = "bug_prospector.cli.main:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bug_prospector*"]
