# プロジェクト設定サンプル
# 使い方: bp collect --project example-project.yaml

project_id: "serde-rs-serde"

repo:
  url: https://github.com/serde-rs/serde
  vcs_type: git

tracker:
  type: github
  url: https://github.com/serde-rs/serde
  auth:
    token: ${GITHUB_TOKEN}

search:
  labels: [bug]
  state: closed
  limit: 500
  since: "2011-01-01"
  # true: マージ済みPRが紐付いていないIssueはスキップ
  require_pr: true

language:
  type: rust
  # テストファイルと判定するパターン（リバースパッチ時のソース/テスト分割に使用）
  test_patterns:
    - "tests/**"
  # テスト実行前の環境セットアップ（worktree 内で一度だけ実行）
  setup_commands:
    - "cargo build --quiet"
  # テスト実行コマンド
  test_command: "cargo test"
  # タイムアウト（秒）
  test_timeout: 120

validation:
  # true にするとリバースパッチ戦略でテスト検証を行い
  # FAIL→PASS が確認されたものだけ "valid" として記録する
  enabled: true
  # reverse_patch_source: ソースファイルのみ逆パッチ（fixで追加されたテストは保持）
  # reverse_patch_all:    全ファイルを逆パッチ
  strategy: reverse_patch_source
  # true にすると dataset/test-logs/{project_id}/ にテスト出力を保存する
  save_test_output: true
  # true にすると失敗したテストケース名をログに出力する
  show_failed_tests: true

llm:
  # bp generate-tests 用（doc/test-generation.md 参照）
  enabled: true
  provider: claude_code
  max_attempts: 3
  max_context_chars: 20000
  claude_code:
    command: "claude"
    allowed_tools: "Read,Grep,Glob,Write,Edit"
    timeout: 900
