# プロジェクト設定サンプル
# 使い方: bp collect --project fastapi.yaml

project_id: "fastapi-fastapi"

repo:
  url: https://github.com/fastapi/fastapi
  vcs_type: git

tracker:
  type: github
  url: https://github.com/fastapi/fastapi
  auth:
    token: ${GITHUB_TOKEN}

search:
  labels: [bug]
  state: closed
  limit: 500
  since: "2011-01-01"
  # true: マージ済みPRが紐付いていないIssueはスキップ
  require_pr: true

language:
  type: python
  # テストファイルと判定するパターン（リバースパッチ時のソース/テスト分割に使用）
  test_patterns:
    - "tests/**"
  # テスト実行前の環境セットアップ（worktree 内で一度だけ実行）
  # tests extra に pytest/pytest-cov/httpx 等の実行に必要な依存が一式含まれる
  setup_commands:
    - "pip install -e \".[tests]\" --quiet"
  # テスト実行コマンド
  test_command: "pytest -q"
  # タイムアウト（秒）。テスト本数が多いため長めに設定。
  test_timeout: 300

validation:
  # true にするとリバースパッチ戦略でテスト検証を行い
  # FAIL→PASS が確認されたものだけ "valid" として記録する
  enabled: true
  # reverse_patch_source: ソースファイルのみ逆パッチ（fixで追加されたテストは保持）
  # reverse_patch_all:    全ファイルを逆パッチ
  strategy: reverse_patch_source
  # true にすると dataset/test-logs/{project_id}/ にテスト出力を保存する
  save_test_output: true
  # true にすると失敗したテストケース名をログに出力する
  show_failed_tests: true
